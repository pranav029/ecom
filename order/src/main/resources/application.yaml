server:
  port: 8084
spring:
  application:
    name: order
  config:
    import: optional:file:order/.env[.properties]
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
  sql:
    init:
      platform: postgres

provision:
  multitenancy:
    enabled: true
    entity-package: com.ecom.order.entities
  api:
    enabled: true
    identifier: order